<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #ef4444;
            --active-color: #22c55e;
            --text-color: #f8fafc;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 12px;
            user-select: none;
        }

        /* Top Header Stats */
        .game-status {
            display: flex;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 16px;
            font-weight: bold;
            color: #38bdf8;
        }

        /* Last Called Number Display */
        .current-number-container {
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            border: 2px solid #6366f1;
            border-radius: 16px;
            padding: 10px;
            margin-bottom: 15px;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        }

        .current-number {
            font-size: 32px;
            font-weight: 900;
            color: #facc15;
            letter-spacing: 2px;
        }

        /* BINGO Headers */
        .bingo-header {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            max-width: 360px;
            margin: 0 auto 6px auto;
        }

        .bingo-letter {
            background: #334155;
            color: #facc15;
            font-size: 18px;
            font-weight: 800;
            padding: 8px 0;
            border-radius: 8px;
        }

        /* Numbers Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            max-width: 360px;
            margin: 0 auto;
        }

        .number-box {
            background: var(--card-bg);
            border: 1px solid #334155;
            padding: 10px 0;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            color: #cbd5e1;
            transition: all 0.2s ease;
        }

        /* Called Number State */
        .number-box.called {
            background: var(--accent-color);
            color: #ffffff;
            border-color: #f87171;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
            transform: scale(1.05);
        }

        /* User Selected State */
        .number-box.marked {
            background: var(--active-color);
            color: #ffffff;
            border-color: #4ade80;
        }
    </style>
</head>
<body>

    <!-- Header Stats -->
    <div class="game-status">
        <div class="stat-box">
            <span class="stat-label">ተጫዋቾች</span>
            <span class="stat-value" id="players">12</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">የጨዋታው ካፒታል</span>
            <span class="stat-value" id="prize">250 ETB</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">የካርድ ቁጥር</span>
            <span class="stat-value">#04</span>
        </div>
    </div>

    <!-- Live Call Box -->
    <div class="current-number-container">
        <div style="font-size: 12px; color: #a5b4fc; margin-bottom: 2px;">የወጣው ቁጥር / LAST CALL</div>
        <div class="current-number" id="lastCall">---</div>
    </div>

    <!-- BINGO Letters -->
    <div class="bingo-header">
        <div class="bingo-letter">B</div>
        <div class="bingo-letter">I</div>
        <div class="bingo-letter">N</div>
        <div class="bingo-letter">G</div>
        <div class="bingo-letter">O</div>
    </div>

    <!-- 1-75 Numbers Grid -->
    <div class="grid" id="bingoGrid"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const grid = document.getElementById('bingoGrid');
        
        // Render 1 to 75 numbers
        for (let i = 1; i <= 75; i++) {
            let div = document.createElement('div');
            div.className = 'number-box';
            div.id = 'num-' + i;
            div.innerText = i;
            
            // Click/Tap to mark
            div.onclick = function() {
                this.classList.toggle('marked');
            };

            grid.appendChild(div);
        }

        // Demo Function to simulate numbers being called
        function markNumber(num) {
            let el = document.getElementById('num-' + num);
            if(el) {
                el.classList.add('called');
                document.getElementById('lastCall').innerText = num;
            }
        }
    </script>
</body>
</html>
